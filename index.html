<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <aside class="sidebar">
    <div class="logo-wrap">
      <img src="https://cdn.statically.io/gh/TheOdinProject/curriculum/5f37d43908ef92499e95a9b90fc3cc291a95014c/html_css/project-sign-up-form/odin-lined.png" alt="Odin logo">
      <span>ODIN</span>
    </div>
    <p class="photo-credit">
      Photo by <a href="https://thumbs.dreamstime.com/b/torre-de-comares-de-alhambra-en-granda-vertical-de-espa%C3%B1a-40352237.jpg">Sgoodwin</a> on Unsplash
    </p>
  </aside>

  <main class="content">
    <section class="intro">
      <p>
        Not a real travel site… yet!
        Join us and start planning your dream destinations today. Sign up <em>now</em>
        to get started.<br>
        You <strong>know</strong> you want to wander.
      </p>
    </section>

    <form action="#" method="post">
      <fieldset>
        <legend>Let’s do this!</legend>

        <div class="form-row">
          <div class="form-group">
            <label for="first-name">First Name</label>
            <input id="first-name" name="first_name" type="text" required>
          </div>

          <div class="form-group">
            <label for="last-name">Last Name</label>
            <input id="last-name" name="last_name" type="text" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input id="phone" name="phone" type="tel">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input id="confirm-password" name="confirm_password" type="password" required>
          </div>
        </div>

      </fieldset>

      <button type="submit">Create Account</button>
      <p class="login-hint">Already have an account? <a href="#">Log in</a></p>
    </form>
  </main>

</body>
</html>
